name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read APISwitch version
        shell: pwsh
        run: |
          . ./scripts/version.ps1
          $version = Get-APISwitchVersion -RepositoryRoot (Get-Location).Path
          "APISWITCH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build Windows desktop executable
        shell: powershell
        run: ./scripts/package-desktop.ps1 -Clean

      - name: Upload APISwitch executable
        uses: actions/upload-artifact@v4
        with:
          name: APISwitch-windows-x64-v${{ env.APISWITCH_VERSION }}
          path: dist/APISwitch-v${{ env.APISWITCH_VERSION }}.exe
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Run Ruff fatal checks
        run: python -m ruff check backend --select F,E9

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  sensitive-scan:
    name: Sensitive credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan tracked source and documentation
        run: python scripts/scan-sensitive.py .

  package-windows:
    name: Windows one-file package and smoke test
    needs:
      - backend
      - frontend
      - sensitive-scan
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read APISwitch version
        id: version
        shell: pwsh
        run: |
          . ./scripts/version.ps1
          $version = Get-APISwitchVersion -RepositoryRoot (Get-Location).Path
          "APISWITCH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build APISwitch.exe
        shell: pwsh
        run: ./scripts/package-desktop.ps1 -Clean
      - name: Verify packaged health, UI, port fallback, and single instance
        shell: pwsh
        run: ./scripts/verify-desktop-package.ps1
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APISwitch-desktop-diagnostics-v${{ env.APISWITCH_VERSION }}
          path: dist/diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Scan packaged executable
        run: python scripts/scan-sensitive.py dist/APISwitch-v${{ env.APISWITCH_VERSION }}.exe
      - name: Record SHA-256
        shell: pwsh
        run: |
          $exe = "./dist/APISwitch-v$($env:APISWITCH_VERSION).exe"
          $checksum = "./dist/APISwitch-v$($env:APISWITCH_VERSION).sha256.txt"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          "${hash}  APISwitch-v$($env:APISWITCH_VERSION).exe" | Set-Content -Encoding ascii $checksum
          Get-Item $exe | Select-Object Name, Length
          Get-Content $checksum
      - uses: actions/upload-artifact@v4
        with:
          name: APISwitch-windows-x64-v${{ env.APISWITCH_VERSION }}
          path: |
            dist/APISwitch-v${{ env.APISWITCH_VERSION }}.exe
            dist/APISwitch-v${{ env.APISWITCH_VERSION }}.sha256.txt
            dist/diagnostics/*.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: APISwitch-windows-x64-v${{ needs.package-windows.outputs.version }}
          path: release
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package-windows.outputs.version }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "APISwitch $tag" --generate-notes
          fi
          gh release upload "$tag" release/*.exe release/*.sha256.txt --clobber
